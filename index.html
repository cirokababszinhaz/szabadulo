const DB = {
  watch: (p, cb) => {
    const ref = rtdb.ref(p);
    ref.on('value', snap => cb(snap.exists() ? snap.val() : null), err => console.error("RTDB hiba:", err));
    return () => ref.off();
  },
  get: async p => {
    const snap = await Promise.race([
      rtdb.ref(p).once('value'),
      new Promise((_, reject) => setTimeout(() => reject(new Error('Időtúllépés a Firebase kapcsolatban')), 5000))
    ]);
    return snap.exists() ? snap.val() : null;
  },
  set: async (p, d, merge = true) => {
    if (merge) return rtdb.ref(p).update(d);
    return rtdb.ref(p).set(d);
  },
  del: async p => rtdb.ref(p).remove()
};

const hav = (a, b) => {
  const R = 6371000, r = x => x * Math.PI / 180, dLa = r(b.lat - a.lat), dLo = r(b.lng - a.lng);
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
};

function imgToData(file, max = 800, q = .55) {
  return new Promise((ok, no) => {
    const u = URL.createObjectURL(file), i = new Image();
    i.onload = () => {
      const s = Math.min(1, max / Math.max(i.width, i.height)), c = document.createElement('canvas');
      c.width = Math.round(i.width * s); c.height = Math.round(i.height * s);
      c.getContext('2d').drawImage(i, 0, 0, c.width, c.height); URL.revokeObjectURL(u); ok(c.toDataURL('image/jpeg', q));
    };
    i.onerror = no; i.src = u;
  });
}
const blobData = b => new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(b); });

/* KLIENSOLDALI KÉPELEMZŐ WORKER */
function analyzeImageWorker(imgUrl, colorRule = '') {
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const cv = document.createElement('canvas'), cx = cv.getContext('2d');
      cv.width = 100; cv.height = 100;
      cx.drawImage(img, 0, 0, 100, 100);
      const data = cx.getImageData(0, 0, 100, 100).data;
      let brightness = 0, redCount = 0, greenCount = 0, blueCount = 0;
      const totalPixels = data.length / 4;
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i+1], b = data[i+2];
        brightness += (r + g + b) / 3;
        if (r > 100 && r > g * 1.35 && r > b * 1.35) redCount++;
        if (g > 90 && g > r * 1.25 && g > b * 1.25) greenCount++;
        if (b > 100 && b > r * 1.3 && b > g * 1.3) blueCount++;
      }
      const avgBrightness = brightness / totalPixels;
      if (avgBrightness < 16) return resolve({ok: false, msg: 'Túl sötét a fotó! Kapcsoljatok vakut vagy keressetek világosabb helyet.'});
      if (colorRule === 'red' && (redCount / totalPixels < 0.04)) return resolve({ok: false, msg: 'A kép felismerő nem talált elegendő piros színt a fotón!'});
      if (colorRule === 'green' && (greenCount / totalPixels < 0.04)) return resolve({ok: false, msg: 'A kép felismerő nem talált elegendő zöld színt a fotón!'});
      if (colorRule === 'blue' && (blueCount / totalPixels < 0.04)) return resolve({ok: false, msg: 'A kép felismerő nem talált elegendő kék színt a fotón!'});
      return resolve({ok: true, msg: 'Felismerés sikeres: megfelelő motívum és minőség!'});
    };
    img.onerror = () => resolve({ok: true, msg: 'Fotó elfogadva!'});
    img.src = imgUrl;
  });
}

async function scanQR() {
  const o = overlay('<video id="qv" playsinline muted style="width:100%;max-width:340px;background:#000;border-radius:12px"></video><div class="small" style="margin:12px">Irányítsd a kamerát a QR-kódra!</div><button class="ghost" id="qc" style="max-width:280px">Mégse</button>');
  const v = $('#qv'); let stream, stop = false;
  return new Promise(async res => {
    const done = val => { stop = true; if (stream) stream.getTracks().forEach(t => t.stop()); closeOverlay(); res(val); };
    $('#qc').onclick = () => done(null);
    try {
      stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}});
      v.srcObject = stream; await v.play();
    } catch (e) { toast('Nem érhető el a kamera!'); return done(null); }
    const det = 'BarcodeDetector' in window ? new BarcodeDetector({formats: ['qr_code']}) : null;
    const cv = document.createElement('canvas'), cx = cv.getContext('2d', {willReadFrequently: true});
    const loop = async () => {
      if (stop) return;
      try {
        if (det) { const c = await det.detect(v); if (c.length) return done(c[0].rawValue); }
        else if (v.videoWidth && window.jsQR) {
          cv.width = v.videoWidth; cv.height = v.videoHeight; cx.drawImage(v, 0, 0);
          const r = jsQR(cx.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height);
          if (r) return done(r.data);
        }
      } catch (e) {}
      setTimeout(loop, 180);
    };
    loop();
  });
}

}

}

  if (watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  clearInterval(hb); clearInterval(tickT); clearInterval(unlockT);
  try { if (wakeLock) wakeLock.release(); } catch (e) {} wakeLock = null;
  td = null; lastKey = '';
}

function attach() {
  detach(); screen = 'play';
  unsubTeam = DB.watch('teams/' + team, d => {
    if (!d || d.session !== sid) return kicked(d);
    td = d; renderPlay();
  });
  syncGps(); keepAwake();
  hb = setInterval(heartbeat, 4000);
  unlockT = setInterval(checkUnlock, 1000);
}

function kicked(d) {
  detach(); localStorage.removeItem('cir_team'); team = null; screen = 'kicked';
  app().innerHTML = `<div class="card center"><h1>🔄</h1><h2>${d ? 'Egy másik készülék belépett ezzel a csapattal' : 'A játék újraindult'}</h2><p class="small">Ezen a telefonon a küldetés megszakadt.</p><button id="back">Vissza a csapatválasztáshoz</button></div>`;
  $('#back').onclick = teamsScreen;
}

function curTarget() {
  if (!td || td.phase !== 'go') return null;
  const s = stepsOf(team)[td.step]; if (!s) return null;
  const L = cfg.locs[locOf(s)];
  return {s, L: (L && typeof L.lat === 'number' && typeof L.lng === 'number') ? L : null};
}

function onPos(p) {
  gpsErr = '';
  buf.push({lat: p.coords.latitude, lng: p.coords.longitude}); if (buf.length > 3) buf.shift();
  pos = {lat: buf.reduce((a, b) => a + b.lat, 0) / buf.length, lng: buf.reduce((a, b) => a + b.lng, 0) / buf.length, acc: p.coords.accuracy, ts: now()};
  const t = curTarget();
  if (t && t.L) {
    hist.push({ts: pos.ts, d: hav(pos, t.L)});
    while (hist.length > 60 || (hist.length && pos.ts - hist[0].ts > 30000)) hist.shift();
  }
  updateMeter();
}
function onPosErr(e) { pos = null; gpsErr = (e && e.code === 1) ? 'denied' : 'nosignal'; updateMeter(); }
function syncGps() {
  if (screen !== 'play') return;
  if (cfg.gpsEnabled && navigator.geolocation && watchId == null) watchId = navigator.geolocation.watchPosition(onPos, onPosErr, GPS_OPTS);
  else if (!cfg.gpsEnabled && watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; pos = null; buf = []; hist = []; }
  updateMeter();
}
async function keepAwake() {
  try {
    if ('wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && screen === 'play') keepAwake(); });
// Másodpercenként ellenőriz, így akkor is nyit, ha a telefon áll és nem érkezik új GPS-esemény.
function checkUnlock() {
  const t = curTarget();
  if (!cfg.gpsEnabled || !t || !t.L || !pos || now() - pos.ts > 120000) { hits = 0; return; }
  if (hav(pos, t.L) <= (t.L.r || DEFAULT_RADIUS) && pos.acc <= MAX_UNLOCK_ACC) { if (++hits >= 2) { hits = 0; unlock(); } } else hits = 0;
}

function unlock() { if (td && td.phase === 'go') DB.set('teams/' + team, {phase: 'task', lastActive: now()}); }

function heartbeat() {
  if (!td || screen !== 'play') return;
  const t = curTarget(); let dist = null;
  if (t && t.L && pos) dist = Math.round(hav(pos, t.L) * 10) / 10;
  DB.set('teams/' + team, {lastSeen: now(), dist, acc: pos ? Math.round(pos.acc) : null});
}

/* ================= ANALÓG GAUGE ================= */
function getHeatFactor(dist, r) {
  if (dist <= r) return 1.0;
  const f = 1 - Math.log(dist / r) / Math.log(HEAT_MAX_M / r);   // folyamatos, logaritmikus skála
  return Math.max(0.03, Math.min(0.99, f));
}

function updateMeter() {
  const needle = $('#mainNeedle'), subNeedle = $('#subNeedle'), txt = $('#gaugeTxt'), distBadge = $('#distBadge'), gpsAcc = $('#gpsAcc'), trendEl = $('#trend');
  if (!needle || !txt) return;
  const rest = (msg, badge, color) => {
    needle.style.transform = 'rotate(-115deg)';
    if (subNeedle) subNeedle.style.transform = 'rotate(0deg)';
    txt.textContent = msg; txt.style.color = color || 'var(--mut)';
    if (distBadge) { distBadge.style.display = ''; distBadge.textContent = badge || ''; }
    if (trendEl) trendEl.textContent = '';
    if (gpsAcc) gpsAcc.textContent = '';
  };
  const t = curTarget();
  if (!cfg.gpsEnabled) return rest('🧭 A műszer most ki van kapcsolva', 'A helyszín-QR nyitja meg a feladatot!');
  if (!t || !t.L) return rest('📍 Helyszín-QR keresése szükséges', 'Használjátok a QR-kódot!');
  if (gpsErr === 'denied') return rest('🚫 A helymeghatározás le van tiltva', 'Engedélyezd a böngésző beállításaiban, vagy használd a QR-t!', 'var(--bad)');
  if (!pos) return rest(gpsErr ? '📡 Nincs GPS-jel' : '📡 GPS jel keresése…', gpsErr ? 'Menj ablak közelébe vagy szabadabb térbe!' : 'Menj szabadabb térbe!');

  const r = t.L.r || DEFAULT_RADIUS, d = hav(pos, t.L), f = getHeatFactor(d, r);
  needle.style.transform = `rotate(${-115 + f * 230}deg)`;
  // kis mutató: közel = bal (piros) vég, távol = jobb (kék) vég
  if (subNeedle) subNeedle.style.transform = `rotate(${-60 + Math.min(d, 80) / 80 * 120}deg)`;
  if (distBadge) { distBadge.style.display = cfg.showDist ? '' : 'none'; distBadge.textContent = `📍 Távolság: kb. ${Math.round(d)} méter`; }
  if (gpsAcc) gpsAcc.textContent = `(GPS pontosság: ±${Math.round(pos.acc)} m)` + (pos.acc > MAX_UNLOCK_ACC ? ' – gyenge jel, használjátok a QR-t!' : '');
  if (trendEl) {
    const old = [...hist].reverse().find(x => x.ts <= pos.ts - 5000);
    const diff = old ? d - old.d : 0;
    trendEl.textContent = !old ? '' : diff < -2.5 ? '🔺 Melegszik!' : diff > 2.5 ? '🔻 Hűl…' : '▪️ Egy helyben vagytok';
  }
  // a küszöbök a számlap íveihez igazodnak (kék / zöld / piros)
  if (f >= 0.92) { txt.textContent = '🔥 ITT VAGYTOK!'; txt.style.color = 'var(--bad)'; }
  else if (f >= 0.64) { txt.textContent = '🌶️ FORRÓ! Nagyon közel!'; txt.style.color = 'var(--warn)'; }
  else if (f >= 0.41) { txt.textContent = '🙂 MELEG!'; txt.style.color = 'var(--gold)'; }
  else if (f >= 0.25) { txt.textContent = '😐 LANGYOS…'; txt.style.color = '#74c0fc'; }
  else { txt.textContent = '🥶 HIDEG…'; txt.style.color = '#a5d8ff'; }
}

function taskUI(b, s, extraHtml, hintUsed) {

    <div class="row" style="margin-top:14px">
      ${(!hintUsed && s.hint) ? `<button class="sm ghost" id="getHint">💡 Tipp kérése (-${HINT_PENALTY} ⭐)</button>` : ''}
      ${(!td.sosActive) ? `<button class="sm ghost" id="callSos">🆘 Segítség kérése (-${SOS_PENALTY} ⭐)</button>` : ''}
    </div>
  </div>`;

  if ($('#getHint')) $('#getHint').onclick = () => claimHint(s);
  if ($('#callSos')) $('#callSos').onclick = askSos;

  const T = $('#task');
  const lock = btn => { btn.disabled = true; btn.textContent = 'Ellenőrzés folyamatban…'; };

  if (s.type === 'count' || s.type === 'text') {
    T.innerHTML = `<input id="ans" ${s.type === 'count' ? 'inputmode="numeric"' : ''} placeholder="${s.type === 'count' ? 'Írd be a számot…' : 'Írd be a választ…'}" autocomplete="off"><button id="sendA">Ellenőrzés és beküldés</button>`;
    const doSubmit = async () => {
      const v = $('#ans').value; if (!v.trim()) return;
      const ok = !s.answer || String(s.answer).split('|').some(a => norm(a) === norm(v));
      if (!ok) { $('#ans').classList.add('shake'); setTimeout(() => $('#ans').classList.remove('shake'), 400); return toast('Nem egészen… próbáljátok újra!'); }
      lock($('#sendA')); await submit(s, s.type, null, v.trim());
    };
    $('#sendA').onclick = doSubmit;
    $('#ans').onkeydown = e => { if (e.key === 'Enter') doSubmit(); };
  } else if (s.type === 'photo') {
    T.innerHTML = `<input type="file" id="pf" accept="image/*" capture="environment" hidden><button id="pick">📷 Fotó készítése</button><div id="prev"></div>`;
    $('#pick').onclick = () => $('#pf').click();
    $('#pf').onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      $('#workerFeedback').textContent = '🤖 Képelemző vizsgálja a fotót…';
      const url = await imgToData(f);
      const res = await analyzeImageWorker(url, s.colorRule || '');
      if (!res.ok) {
        $('#workerFeedback').textContent = '⚠️ ' + res.msg;
        $('#workerFeedback').style.color = 'var(--bad)';
        toast(res.msg);
        return;
      }
      $('#workerFeedback').textContent = '✅ ' + res.msg;
      $('#workerFeedback').style.color = 'var(--ok)';
      $('#prev').innerHTML = `<img class="thumb" src="${url}" style="margin-top:12px;cursor:default"><button id="sendP">✅ Fotó beküldése</button>`;
      $('#sendP').onclick = async () => { lock($('#sendP')); await submit(s, 'photo', url); };
    };
  } else if (s.type === 'qr') {
    T.innerHTML = '<button id="scan">📷 Rejtett QR-kód beolvasása</button>';
    $('#scan').onclick = async () => {
      const r = await scanQR(); if (r == null) return;
      if (!s.qr || r.trim() === s.qr) { lock($('#scan')); await submit(s, 'qr', null, r.trim()); } else toast('Ez nem a keresett kód 🤔');
    };
  } else if (s.type === 'sing') singUI(T, s, lock);
}

function singUI(T, s, lock) {
  T.innerHTML = '<button id="rec">🎤 Ének felvétele (max 30 mp)</button><div class="small center" id="recinfo" style="margin-top:6px"></div><div id="prev"></div>';
  let rec, chunks = [], timer, t0;
  $('#rec').onclick = async () => {
    if (rec && rec.state === 'recording') { rec.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio: true});
      const mt = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
      chunks = []; rec = new MediaRecorder(stream, mt ? {mimeType: mt, audioBitsPerSecond: 28000} : {audioBitsPerSecond: 28000});
      rec.ondataavailable = e => e.data.size && chunks.push(e.data);
      rec.onstop = async () => {
        clearInterval(timer); stream.getTracks().forEach(t => t.stop());
        const durationSec = Math.floor((now() - t0) / 1000);
        if (durationSec < 4) {
          toast('Túl rövid volt a felvétel, énekeljetek legalább 5 másodpercig!');
          $('#rec').textContent = '🔁 Újrafelvétel';
          return;
        }
        $('#rec').textContent = '🔁 Újrafelvétel'; $('#recinfo').textContent = '';
        const url = await blobData(new Blob(chunks, {type: rec.mimeType || 'audio/webm'}));
        $('#prev').innerHTML = `<audio controls src="${url}" style="width:100%;margin-top:12px"></audio><button id="sendS">✅ Ének beküldése</button>`;
        $('#sendS').onclick = async () => {
          if (url.length > 950000) return toast('Túl hosszú az ének, vegyétek fel rövidebben!');
          lock($('#sendS')); await submit(s, 'sing', url);
        };
      };
      rec.start(); t0 = now(); $('#rec').textContent = '⏹ Felvétel leállítása';
      timer = setInterval(() => {
        const e = Math.floor((now() - t0) / 1000);
        $('#recinfo').textContent = '🔴 Rögzítés: ' + e + ' / 30 mp';
        if (e >= 30) rec.stop();
      }, 300);
    } catch (e) { toast('Nem érhető el a mikrofon!'); }
  };
}

async function claimHint(s) {
  if (!confirm(`Biztosan kérsz egy tippet?\nEz ${HINT_PENALTY} pont levonással jár!`)) return;
  const hints = td.hintsUsed ? [...td.hintsUsed] : [];
  if (!hints.includes(td.step)) hints.push(td.step);
  await DB.set('teams/' + team, {
    points: Math.max(0, (td.points || 0) - HINT_PENALTY),
    hintsUsed: hints,
    lastActive: now()
  });
  toast('Tipp feloldva!');
}

async function askSos() {
  const msg = prompt(`Segítségkérés a Központtól.\nEz ${SOS_PENALTY} pont levonással jár.\n\nMiben akadtatok el?`);
  if (!msg || !msg.trim()) return;
  await DB.set('teams/' + team, {
    sosActive: true,
    sosMsg: msg.trim(),
    sosReply: '',
    sosTime: now(),
    points: Math.max(0, (td.points || 0) - SOS_PENALTY),
    lastActive: now()
  });
  toast('Segítségkérés elküldve!');
}

async function submit(s, type, data, answer) {
  const id = team + '_' + td.step + '_' + now();
  await DB.set('subs/' + id, {team, stepId: s.id, stepName: s.name, type, data: data || null, answer: answer || null, ts: now()}, false);
  const n = td.step + 1;
  const earned = s.points || POINTS_PER_STEP;
  await DB.set('teams/' + team, {
    step: n,
    phase: n >= stepsOf(team).length ? 'final' : 'go',
    points: (td.points || 0) + earned,
    sosReply: '',
    sosActive: false,
    lastActive: now()
  });
  toast(`🎉 Feladat teljesítve! (+${earned} ⭐)`);
}

/* ================= FINÁLÉ KÓDOS FELOLDÁSSAL ================= */
function finalUI(b) {
  const f = FINALS[cfg.finals[team]] || FINALS.lego;

  // 1. ÁLLAPOT: Visszaértek az asztalhoz, de még be kell írniuk a feloldókódot!
  if (!td.finalUnlocked) {
    b.innerHTML = `<div class="card center">
      <div class="eyebrow">A KÜLDETÉS UTOLSÓ SZAKASZA</div>
      <div class="clue">🎁🔐</div>
      <h1>Minden állomás teljesítve!</h1>
      <p>Sikeresen összegyűjtöttétek a koordinátákat! Most menjetek az asztalotokhoz a nagyteremben.</p>
      <p class="small" style="color:var(--gold);font-weight:700">Üssétek be a feloldókódot az asztalról, hogy kiderüljön, melyik alkotó feladat a tiétek!</p>
      <input id="finalCodeInput" placeholder="Feloldókód beírása…" autocomplete="off" style="text-align:center;font-weight:800;letter-spacing:2px">
      <button id="unlockFinalBtn">🔓 Feladat leleplezése</button>
    </div>`;

    const doUnlock = async () => {
      const v = norm($('#finalCodeInput').value);
      if (!v) return;
      const allowed = FINAL_UNLOCK_CODES.map(norm);
      if (allowed.includes(v) || v === norm(cfg.teams[team].name)) {
        await DB.set('teams/' + team, {finalUnlocked: true, lastActive: now()});
        toast('Sikeres feloldás!');
      } else {
        $('#finalCodeInput').classList.add('shake');
        setTimeout(() => $('#finalCodeInput').classList.remove('shake'), 400);
        toast('Hibás feloldókód!');
      }
    };
    $('#unlockFinalBtn').onclick = doUnlock;
    $('#finalCodeInput').onkeydown = e => { if (e.key === 'Enter') doUnlock(); };
    return;
  }

  // 2. ÁLLAPOT: A kód helyes volt, megmutatja a konkrét feladatot és indul az időzítő!
  b.innerHTML = `<div class="card center">
    <div class="eyebrow">DÖNTŐ KÉZMŰVES FELADAT</div>
    <div class="clue">${f.icon}</div>
    <h1 style="color:var(--gold)">${esc(f.title)}</h1>
    <p style="font-size:18px;font-weight:700">${esc(f.desc)}</p>
    <p class="small">Keresd meg az asztalotokon az ehhez tartozó tálcát! Az alkotásra ${FINAL_SECONDS / 60} percetek van.</p>
    <div id="fx"></div>
  </div>`;

  const fx = $('#fx');
  if (!td.finalStart) {
    fx.innerHTML = '<button id="fstart">⏱️ Indítom a 3 perces visszaszámlálást!</button>';
    $('#fstart').onclick = () => DB.set('teams/' + team, {finalStart: now(), lastActive: now()});
    return;
  }
  fx.innerHTML = `<div class="timer" id="ftm"></div>
    <input type="file" id="ff" accept="image/*" capture="environment" hidden>
    <button id="fpick">📷 Elkészült alkotás lefotózása</button>
    <div id="prev"></div>`;
  const tick = () => {
    const left = Math.max(0, FINAL_SECONDS - Math.floor((now() - td.finalStart) / 1000));
    const e = $('#ftm'); if (!e) return;
    e.textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
    e.style.color = left === 0 ? 'var(--bad)' : (left <= 30 ? 'var(--warn)' : '');
  };
  tick(); tickT = setInterval(tick, 500);

  $('#fpick').onclick = () => $('#ff').click();
  $('#ff').onchange = async e => {
    const file = e.target.files[0]; if (!file) return;
    toast('Fotó feldolgozása…');
    const url = await imgToData(file);
    $('#prev').innerHTML = `<img class="thumb" src="${url}" style="margin-top:12px;cursor:default"><button id="fsend">✅ Küldetés befejezése és fotó beküldése</button>`;
    $('#fsend').onclick = async () => {
      $('#fsend').disabled = true;
      await DB.set('subs/' + team + '_final_' + now(), {team, stepId: 'final', stepName: f.title, type: 'final', data: url, answer: null, ts: now()}, false);
      await DB.set('teams/' + team, {phase: 'done', finishedAt: now(), points: (td.points || 0) + POINTS_PER_STEP, lastActive: now()});
    };
  };
}

async function start() {
  snow();
  DB.watch('config/main', r => {
    remote = r || {}; build();
    if (screen === 'teams') teamsScreen(); else if (screen === 'play' && td) renderPlay();
    if (screen === 'play') syncGps();
  });
  if (localStorage.getItem('cir_auth') !== '1') return loginScreen();
  if (team) {
    try {
      const d = await DB.get('teams/' + team);
      if (d && d.session === sid) return attach();
    } catch (e) { return attach(); }   // nincs kapcsolat: a figyelő majd eldönti, mi a helyzet
    team = null; localStorage.removeItem('cir_team');
  }
  teamsScreen();
}

start();
</script>
